<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicResolve Administration Portal - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>CivicResolve Administration</h2>
            <p style="font-size: 12px; color: #64748B; margin-bottom: 1rem;">Authorized Municipal Personnel Only</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Officer Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Security Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">Sign In to Gateway</button>
                <button type="button" id="test-btn" class="login-btn" style="background: #1E3A5F; margin-top: 0.5rem;" onclick="window.location.href='index.html'">Open Admin Console (Demo Access)</button>
                <div id="error-message" class="error-message"></div>
            </form>
        </div>
    </div>
    <script src="js/database.js"></script>
    <script src="js/auth-simple.js"></script>
</body>
</html>
